name: Risograph Storybook browser QA

# Targeted browser qualification. Keep manual-only after first PR evidence capture.
on:
  pull_request:
    branches: [main]
    paths:
      - "tests/e2e-storybook/riso-film-looks.spec.ts"
      - "registry/video/print-plates-react.tsx"
      - "src/video/riso-print-demo.tsx"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: riso-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser geometry, ink passes, nonsequential seeking and frame screenshots
        run: npx playwright test -c playwright.storybook.config.ts tests/e2e-storybook/riso-film-looks.spec.ts
      - name: Preserve actual screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riso-browser-evidence
          path: test-results/
          retention-days: 10
          if-no-files-found: warn
