name: One-time RISO8 fine mesh and all-Storybook qualification
# Remove after the visual/registry proof. Routine GitHub CI remains changed-tests only.
on:
  pull_request:
    branches: [main]
    paths:
      - "registry/video/riso-path-geometry.ts"
      - "registry/video/riso-proportion-mesh.ts"
      - "src/video/riso-character-demo.tsx"
      - "src/video/riso-character-model-sheets.stories.tsx"
      - "registry/video/riso-character-sheet-react.tsx"
      - "tests/e2e-storybook/riso-storybook-smoke.spec.ts"
      - ".github/workflows/riso8-one-time-qa.yml"
permissions:
  contents: read
concurrency:
  group: riso8-art-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-fine-mesh-and-stories:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Strict types and all impacted Risograph contracts
        run: |
          npm run typecheck
          npm run test -- tests/riso-character.test.tsx tests/riso-rig-ik.test.tsx tests/riso-nested-ik.test.ts tests/riso-joint-skin.test.ts tests/riso-opaque-characters.test.tsx tests/riso-character-model-sheets.test.tsx tests/riso-source-contour.test.ts tests/riso-fine-mesh.test.ts
      - name: Registry metadata and independent consumer installation
        run: |
          npm run registry:validate
          node scripts/registry-fixture.js --item=riso-character
      # Production Storybook build already passed on this PR (run 43636226040).
      # Do not rebuild every unrelated story on a focused browser rerun.
      - name: Install Chromium once
        run: npx playwright install --with-deps chromium
      - name: Verify all 5 Risograph stories and real source-mesh SVG exports
        run: npx playwright test -c playwright.storybook.config.ts --timeout=90000 tests/e2e-storybook/riso-storybook-smoke.spec.ts tests/e2e-storybook/riso-character-model-sheets.spec.ts
      - name: Preserve screenshots, exported SVG and failed traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riso8-fine-mesh-storybook-browser-review
          path: test-results/
          retention-days: 6
          if-no-files-found: warn
