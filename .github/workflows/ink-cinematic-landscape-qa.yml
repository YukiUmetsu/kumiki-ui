name: Ink Cinematic Landscape Film Proof

# Focused CI for original INK7 scene geometry and actual export. No generic visual suite.
on:
  pull_request:
    paths:
      - "registry/video/ink-cinematic*"
      - "src/video/ink-cinematic*"
      - "tests/ink-cinematic-scene.test.tsx"
      - "tests/e2e-storybook/ink-cinematic-scene.spec.ts"
      - "docs/component-specs/ink-cinematic-landscape.md"
      - "registry.json"
      - ".github/workflows/ink-cinematic-landscape-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ink7-cinema-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cinema:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: Source-pure film, motif and frame-seek tests
        run: npx vitest run --project unit tests/ink-cinematic-scene.test.tsx
      - name: Registry validation
        run: npm run registry:validate
      - name: Chromium
        run: npx playwright install --with-deps chromium
      - name: Render painterly scene frames for reference-based art review
        run: npx playwright test -c playwright.storybook.config.ts tests/e2e-storybook/ink-cinematic-scene.spec.ts
      - name: Install FFmpeg for production MP4
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Encode crossing both scenes, landscape
        run: npm run video:export -- --story=video-ink-cinematic-landscape--production-export --startFrame=150 --frames=68 --output=dist/ink7-landscape.mp4
      - name: Encode crossing both scenes, portrait
        run: npm run video:export -- --story=video-ink-cinematic-landscape--portrait-export --startFrame=150 --frames=68 --output=dist/ink7-portrait.mp4
      - name: Preserve video proofs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ink7-encoded-original-video
          path: dist/ink7-*.mp4
          retention-days: 10
          if-no-files-found: warn
      - name: Preserve source-geometry browser images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ink7-painterly-browser-evidence
          path: test-results/
          retention-days: 10
          if-no-files-found: warn
