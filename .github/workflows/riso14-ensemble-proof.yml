name: One-time RISO14 original-human storyboard proof
on:
  pull_request:
    branches: [main]
    paths:
      - "src/video/riso-human-ensemble.tsx"
      - "src/video/riso-artcraft-studies.stories.tsx"
      - "tests/riso14-human-ensemble.test.tsx"
      - "tests/e2e-storybook/riso-human-ensemble.spec.ts"
      - ".github/workflows/riso14-ensemble-proof.yml"
permissions:
  contents: read
concurrency:
  group: riso14-proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  two-human-artcraft:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Typed source and contact/mesh/opaque ink contracts
        run: |
          npm run typecheck
          npx vitest run --project unit tests/riso14-human-ensemble.test.tsx tests/riso13-anatomy.test.tsx tests/riso-character-paper-clearance.test.tsx tests/riso-storybook-navigation.test.ts
      - name: Build release Storybook
        run: npm run build-storybook
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Real two-aspect human contact and all 13 Risograph Storybook pages
        run: npx playwright test -c playwright.storybook.config.ts --timeout=90000 tests/e2e-storybook/riso-human-ensemble.spec.ts tests/e2e-storybook/riso-storybook-smoke.spec.ts
      - name: Preserve source-produced browser frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riso14-clean-human-storybook-evidence
          path: test-results/
          retention-days: 7
          if-no-files-found: warn
