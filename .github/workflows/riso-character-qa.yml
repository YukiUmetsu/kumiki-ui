name: Risograph character film browser QA

# Temporarily qualifies this rigging change with real Chromium and MP4 on PR; restore manual-only after review.
# Lightweight unit, typecheck and registry tests remain automatic in visual-contracts.yml.
# Full browser and encoded-film qualification is local-first and opt-in.
# No expensive renderer/Playwright/FFmpeg job runs for routine PRs or main pushes.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: riso-character-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-riso-acting:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Strict typecheck and focused motion contracts
        run: |
          npm run typecheck
          npm run test -- tests/riso-character.test.tsx tests/riso-rig-ik.test.tsx tests/riso-nested-ik.test.ts tests/riso-joint-skin.test.ts tests/riso-opaque-characters.test.tsx tests/riso-character-model-sheets.test.tsx
      - name: Clean independent registry consumer install
        run: node scripts/registry-fixture.js --item=riso-character
      - name: Chromium
        run: npx playwright install --with-deps chromium
      - name: Actual 16:9 and 9:16 Storybook actor/browser screenshots
        run: npx playwright test -c playwright.storybook.config.ts tests/e2e-storybook/riso-characters.spec.ts tests/e2e-storybook/riso-rig-ik.spec.ts tests/e2e-storybook/riso-opaque-print.spec.ts tests/e2e-storybook/riso-character-model-sheets.spec.ts
      - name: Validate source-portable Film Document
        run: npm run film:check -- examples/film/riso-character-performance.film.json
      - name: Install FFmpeg for true production MP4
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Export original 8-second animation and portrait proof frame
        run: |
          npm run film:frame -- examples/film/riso-character-performance.film.json --frame=157 --only=landscape --out=dist/riso-character-proof
          npm run film:frame -- examples/film/riso-character-performance.film.json --frame=157 --only=portrait --out=dist/riso-character-proof
          npm run film:frame -- examples/film/riso-character-performance.film.json --frame=46 --only=landscape --out=dist/riso-character-proof
          npm run film:frame -- examples/film/riso-character-performance.film.json --frame=46 --only=portrait --out=dist/riso-character-proof
          npm run film:frame -- examples/film/riso-character-performance.film.json --frame=198 --only=landscape --out=dist/riso-character-proof
          npm run film:frame -- examples/film/riso-character-performance.film.json --frame=198 --only=portrait --out=dist/riso-character-proof
          npm run film:render -- examples/film/riso-character-performance.film.json --frames=240 --only=landscape --out=dist/riso-character-proof
      - name: Preserve real animation MP4 and production frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riso-character-production-proof
          path: dist/riso-character-proof/
          retention-days: 10
          if-no-files-found: warn
      - name: Preserve original Chromium screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riso-character-browser-proof
          path: test-results/
          retention-days: 10
          if-no-files-found: warn
