name: Risograph Character Animation QA

# Focused one-time visual proof for the reusable RISC1 actor engine. Restore
# manual-only after new animation and consumer-install evidence is inspected.
on:
  pull_request:
    branches: [main]
    paths:
      - "registry/video/riso-performance.ts"
      - "registry/video/riso-performance-react.tsx"
      - "src/video/riso-performance.stories.tsx"
      - "src/video/riso-performance-fixtures.ts"
      - "tests/e2e-storybook/riso-performance.spec.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: riso-characters-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-and-film:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: TypeScript and original character contracts
        run: |
          npm run typecheck
          npm run test -- tests/riso-performance.test.tsx
      - name: Isolated native Risograph registry installation
        run: node scripts/registry-fixture.js --item=riso-character
      - name: Chromium
        run: npx playwright install --with-deps chromium
      - name: Storybook film acting and deterministic seeking
        run: npx playwright test -c playwright.storybook.config.ts tests/e2e-storybook/riso-performance.spec.ts
      - name: Validate both native FilmStage film documents
        run: |
          npm run film:check -- examples/film/riso-animated-characters.film.json
          npm run film:check -- examples/film/riso-animated-garden.film.json
      - name: Production FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Export genuine production character videos in both aspects
        run: |
          npm run film:frame -- examples/film/riso-animated-characters.film.json --frame=160 --only=landscape --out=dist/riso-character-proof
          npm run film:frame -- examples/film/riso-animated-characters.film.json --frame=420 --only=portrait --out=dist/riso-character-proof
          npm run film:render -- examples/film/riso-animated-characters.film.json --frames=180 --only=landscape --out=dist/riso-character-proof
          npm run film:render -- examples/film/riso-animated-garden.film.json --frames=180 --only=portrait --out=dist/riso-garden-proof
      - name: Preserve playable film and native frame evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riso-characters-production
          path: |
            dist/riso-character-proof/
            dist/riso-garden-proof/
          retention-days: 10
          if-no-files-found: warn
      - name: Preserve actual browser frame captures and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riso-characters-browser
          path: test-results/
          retention-days: 10
          if-no-files-found: warn
