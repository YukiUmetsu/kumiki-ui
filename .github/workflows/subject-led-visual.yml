name: Subject-led visual QA

# Legacy Storybook Playwright qualification is manual-only.
# Preserve the full test and capture workflow without triggering on PRs.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storyboard:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build-storybook
      - name: Check rendered frame geometry, semantic reveals and hold pixel parity
        run: npx playwright test -c playwright.storybook.config.ts tests/e2e-storybook/subject-led-explainer.spec.ts
      - name: Upload frame captures and failing browser traces
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: subject-led-qa
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
