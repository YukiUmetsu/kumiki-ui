name: Changed tests and type safety

# Keep routine GitHub Actions inexpensive: only changed test files are executed.
# Existing full suites, Chromium art reviews, and MP4 exports run locally.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: visual-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changed-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Typecheck changed source against all exported contracts
        run: npm run typecheck
      - name: Guard video Storybook source parsing and local imports
        run: node scripts/check-video-storybook-source.mjs
      - name: Execute only new or modified unit tests
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="${PR_BASE:-${PUSH_BEFORE:-}}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="HEAD^"
          fi
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$base"
          fi
          unit=()
          node=()
          while IFS= read -r file; do
            if [[ ! -f "$file" ]]; then continue; fi
            if [[ "$file" =~ ^tests/[^/]+\.test\.(ts|tsx)$ ]]; then
              unit+=("$file")
            elif [[ "$file" =~ ^tests/[^/]+\.test\.mjs$ ]]; then
              node+=("$file")
            fi
          done < <(git diff --name-only --diff-filter=ACMR "$base" HEAD)
          echo "Changed Vitest files: ${#unit[@]}; Node test files: ${#node[@]}"
          if (( ${#unit[@]} > 0 )); then
            # The change-only PR set currently spans 26 concurrently updated
            # suites, including expensive FLORA1 growth and SKY1 SVG tree
            # generation. Vitest's default 5s per-test budget timed out
            # *both unchanged tests* on identical reruns despite passing
            # their assertions in isolation. Four workers bound resource
            # contention and 15s preserves a realistic finite upper bound.
            # Never skip tests or relax geometry/visual assertions.
            npx vitest run --project unit --maxWorkers=4 --testTimeout=15000 "${unit[@]}"
          fi
          if (( ${#node[@]} > 0 )); then
            node --test "${node[@]}"
          fi
          if (( ${#unit[@]} == 0 && ${#node[@]} == 0 )); then
            echo "No added or edited unit tests; local full suite remains required."
          fi
