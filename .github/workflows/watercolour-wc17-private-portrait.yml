name: WC17 private portrait evidence (not artistic approval)
# Narrow CI: only when the experimental face or its gate changes.
# No new public Storybook story and no expensive full film export.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/video/experimental/watercolour-portrait-study.ts'
      - 'scripts/watercolour-portrait-private-proof.mjs'
      - 'scripts/watercolour-portrait-quality-gate.py'
      - 'tests/watercolour-portrait-quality-gate.test.py'
      - 'tests/watercolour-portrait-experimental.test.tsx'
      - '.github/workflows/watercolour-wc17-private-portrait.yml'
permissions:
  contents: read
jobs:
  strict-numeric-negative-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned ArtCraft image-analysis dependencies
        run: pip install numpy==2.3.5 Pillow==12.3.0 opencv-python-headless==4.13.0.92 scikit-image==0.26.0
      - name: All numeric quality gate positive and negative controls
        run: python tests/watercolour-portrait-quality-gate.test.py -v
  private-static-portrait-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate experimental anatomy without public story
        run: npx vitest run --project unit tests/watercolour-portrait-experimental.test.tsx
      - run: npx playwright install --with-deps chromium
      - name: Actual Chromium private native face and feature-crop captures
        run: node scripts/watercolour-portrait-private-proof.mjs --out=dist/wc17-private-portrait
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wc17-unapproved-native-portrait-crops
          path: dist/wc17-private-portrait/
          retention-days: 7
          if-no-files-found: warn
