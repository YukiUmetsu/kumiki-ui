name: Crayon Storybook browser and film qualification

# Only crayon changes run the small browser gate; full MP4 qualification remains manual.
on:
  pull_request:
    branches: [main]
    paths:
      - "registry/video/materials/crayon*"
      - "src/video/crayon-storybook*"
      - "src/video/crayon-scene*"
      - "tests/crayon-scene.test.tsx"
      - "tests/e2e-storybook/crayon-scene.spec.ts"
      - "tests/e2e-storybook/crayon-smoke.spec.ts"
      - "examples/film/crayon-scene-three-subjects.film.json"
      - "tests/e2e-storybook/crayon-storybook.spec.ts"
      - ".github/workflows/crayon-browser-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crayon-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-film-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Fast native-paper browser smoke
        if: github.event_name != 'workflow_dispatch'
        run: npx playwright test -c playwright.storybook.config.ts tests/e2e-storybook/crayon-smoke.spec.ts
      - name: Full multi-frame browser art qualification
        if: github.event_name == 'workflow_dispatch'
        run: npx playwright test -c playwright.storybook.config.ts tests/e2e-storybook/crayon-storybook.spec.ts tests/e2e-storybook/crayon-scene.spec.ts
      - name: Validate exported film document
        run: |
          npm run film:check -- examples/film/crayon-storybook.film.json
          npm run film:check -- examples/film/crayon-scene-three-subjects.film.json
      - name: Install FFmpeg
        if: github.event_name == 'workflow_dispatch'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Capture material beats in both aspects
        if: github.event_name == 'workflow_dispatch'
        run: |
          for frame in 0 90 156 270 360 419; do
            npm run film:frame -- examples/film/crayon-storybook.film.json --frame=$frame --only=landscape --out=dist/crayon-film-proof
            npm run film:frame -- examples/film/crayon-storybook.film.json --frame=$frame --only=portrait --out=dist/crayon-film-proof
          done
      - name: Render full 14-second encoded film
        if: github.event_name == 'workflow_dispatch'
        run: |
          npm run film:render -- examples/film/crayon-storybook.film.json --frames=420 --only=landscape --out=dist/crayon-film-proof
          npm run film:render -- examples/film/crayon-storybook.film.json --frames=420 --only=portrait --out=dist/crayon-film-proof
      - name: Preserve encoded video and frame proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crayon-production-film-proof
          path: dist/crayon-film-proof/
          retention-days: 10
          if-no-files-found: warn
      - name: Preserve browser stills and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crayon-browser-proof
          path: test-results/
          retention-days: 10
          if-no-files-found: warn
