name: Everyday 3D browser and video evidence
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/everyday-3d-visual.yml'
      - 'registry/craft/everyday-*.ts'
      - 'registry/video/everyday-scenes-3d.ts'
      - 'registry/domains/technology-3d.ts'
      - 'src/components/video/everyday-3d*'
      - 'src/components/video/scene-book-3d.tsx'
      - 'tests/e2e-storybook/everyday-3d.spec.ts'

permissions:
  contents: read

concurrency:
  group: everyday-3d-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-and-ffmpeg:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffprobe -hide_banner -version | head -n 1
      - name: Capture actual WebGL frames and verify nonsequential seeks
        run: npx playwright test -c playwright.storybook.config.ts tests/e2e-storybook/everyday-3d.spec.ts
      - name: Export physically rendered MP4 demonstrations
        run: |
          mkdir -p dist/everyday-3d-evidence
          npm run video:export -- --story=video-production-scene-templates-3d-everyday-objects--cinematic-desk-explainer-capture --output=dist/everyday-3d-evidence/cinematic-desk-explainer.mp4
          npm run video:export -- --story=video-production-scene-templates-3d-everyday-objects--invoice-to-software-capture --output=dist/everyday-3d-evidence/invoice-to-software.mp4
          npm run video:export -- --story=video-production-scene-templates-3d-everyday-objects--epic-book-storytelling-capture --output=dist/everyday-3d-evidence/epic-book-storytelling.mp4
          npm run video:export -- --story=video-production-scene-templates-3d-everyday-objects--document-investigation-capture --output=dist/everyday-3d-evidence/document-investigation.mp4
      - name: Preserve true browser captures and decoded video evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: everyday-3d-rendered-evidence
          path: |
            test-results/**/*.png
            test-results/**/*.webm
            dist/everyday-3d-evidence/*.mp4
          retention-days: 14
          if-no-files-found: warn
