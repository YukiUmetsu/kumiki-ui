name: Colour-pencil wildlife visual proof
# Visual proof runs are opt-in only. Shared film slots are edited by many
# styles; automatic browser+FFmpeg runs here wasted CI on unrelated PRs.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pencil-wildlife-proof
  cancel-in-progress: true
jobs:
  wildlife-film-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify portable wildlife film
        run: npm run film:check -- examples/film/colored-pencil-wildlife.film.json
      - name: Verify completed-art motion reel
        run: npm run film:check -- examples/film/colored-pencil-wildlife-motion-proof.film.json
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Inspect both aspect ratio drawings, pose and opaque support
        run: npx playwright test -c playwright.storybook.config.ts tests/e2e-storybook/colored-pencil-wildlife.spec.ts
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Capture actual pencil film and finished frames
        run: |
          npm run film:frame -- examples/film/colored-pencil-wildlife.film.json --frame=350 --only=landscape --out=dist/pencil-wildlife-proof
          npm run film:frame -- examples/film/colored-pencil-wildlife.film.json --frame=350 --only=portrait --out=dist/pencil-wildlife-proof
          npm run film:render -- examples/film/colored-pencil-wildlife-motion-proof.film.json --only=landscape --out=dist/pencil-wildlife-proof
      - name: Save rendered scene comparisons and trace
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pencil-wildlife-browser-art-review
          path: test-results/
          retention-days: 7
          if-no-files-found: warn
      - name: Save original wildlife film outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pencil-wildlife-video-proof
          path: dist/pencil-wildlife-proof/
          retention-days: 7
          if-no-files-found: warn
