name: One-time RISO7 registry package qualification
# Temporary gate; remove after proof. No expensive browser or video rendering.
on:
  pull_request:
    branches: [main]
    paths:
      - "registry/video/riso-path-geometry.ts"
      - "registry/video/riso-proportion-mesh.ts"
      - "registry.json"
      - ".github/workflows/riso7-visual-proof.yml"
permissions:
  contents: read
concurrency:
  group: riso7-registry-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate registry metadata and dependency references
        run: npm run registry:validate
      - name: Independent consumer installation of source contour mesh
        run: node scripts/registry-fixture.js --item=riso-character
