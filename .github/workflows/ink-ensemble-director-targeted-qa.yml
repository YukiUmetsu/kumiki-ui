name: Ink Ensemble and Character Director targeted art QA

on:
  pull_request:
    paths:
      - "src/video/ink-wash-ensemble*"
      - "src/video/ink-actor-director*"
      - "src/video/ink-figure-classical-art.ts"
      - "registry/video/ink-wash-ensemble*"
      - "tests/ink-wash-ensemble.test.tsx"
      - "tests/ink-actor-director-demo.test.tsx"
      - "tests/e2e-storybook/ink-wash-ensemble.spec.ts"
      - "tests/e2e-storybook/ink-actor-director.spec.ts"
      - ".github/workflows/ink-ensemble-director-targeted-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ink-ensemble-director-${{ github.ref }}
  cancel-in-progress: true

jobs:
  artcraft-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: TypeScript and exact ink acting tests
        run: |
          npm run typecheck
          npx vitest run --project unit tests/ink-wash-ensemble.test.tsx tests/ink-actor-director-demo.test.tsx
      - name: Browser runtime and storybook screenshot proof
        run: |
          npx playwright install --with-deps chromium
          npx playwright test -c playwright.storybook.config.ts tests/e2e-storybook/ink-wash-ensemble.spec.ts tests/e2e-storybook/ink-actor-director.spec.ts
      - name: Preserve actual browser screenshots, errors and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ink-ensemble-director-render-review
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
