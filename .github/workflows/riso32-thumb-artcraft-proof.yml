name: RISO32 ArtCraft opposed-thumb proof

# Scoped to RISO32 source and tests; no full cinematic export on unrelated PRs.
on:
  pull_request:
    paths:
      - ".github/workflows/riso32-thumb-artcraft-proof.yml"
      - "src/video/riso32-thumb-ip.ts"
      - "tests/riso32-thumb-ip-artcraft.test.tsx"
      - "tests/e2e-storybook/riso32-thumb-ip-artcraft.spec.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: riso32-thumb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  anatomy-source-and-native-print:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Strict TypeScript and legacy animated source contracts
        run: |
          npm run typecheck
          npm run test -- tests/riso32-thumb-ip-artcraft.test.tsx tests/riso29-human-anatomy-neck-portrait.test.tsx tests/riso-character.test.tsx tests/riso17-anatomical-grip.test.tsx tests/riso21-ocular-print-artcraft.test.tsx
      - name: Build real Storybook
        run: npm run build-storybook
      - name: Chromium
        run: npx playwright install --with-deps chromium
      - name: Native source printed hands, two spot-ink masters and both actors
        run: npx playwright test -c playwright.storybook.config.ts tests/e2e-storybook/riso32-thumb-ip-artcraft.spec.ts
      - name: Preserve actual screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riso32-native-thumb-proof
          path: test-results/
          retention-days: 7
          if-no-files-found: warn
