name: Risograph ArtCraft hand/stencil proof

# Scoped to RISO32 source and tests; no full cinematic export on unrelated PRs.
on:
  pull_request:
    paths:
      - ".github/workflows/riso32-thumb-artcraft-proof.yml"
      - "src/video/riso32-thumb-ip.ts"
      - "src/video/riso33-hand-negative-space.ts"
      - "src/video/riso36-red-silhouette-gate.ts"
      - "src/video/riso37-anatomical-engraving.ts"
      - "src/video/riso46-thenar-source.ts"
      - "src/video/riso47-palmar-cup.ts"
      - "src/video/riso48-projected-support.ts"
      - "src/video/riso49-donor-projection.ts"
      - "tests/riso49-donor-projection-artcraft.test.ts"
      - "tests/riso50-hand-macro-artcraft.test.ts"
      - "tests/riso51-view-conditioned-source-artcraft.test.ts"
      - "registry/video/riso-path-morph.ts"
      - "registry/video/riso-character.ts"
      - "src/video/riso51-view-conditioned-source.ts"
      - "src/video/riso52-folded-terminal-source.ts"
      - "tests/riso52-folded-terminal-source-artcraft.test.ts"
      - "src/video/riso53-palmar-depth-composition.ts"
      - "tests/riso53-palmar-depth-composition-artcraft.test.tsx"
      - "src/video/riso54-camera-ray-audit.ts"
      - "src/video/riso54-interdigital-paper-reserve.ts"
      - "tests/riso54-interdigital-paper-reserve.test.ts"
      - "src/video/riso55-foldback-pulp-source.ts"
      - "tests/riso55-foldback-pulp-artcraft.test.ts"
      - "src/video/riso56-handoff-camera.ts"
      - "tests/riso56-handoff-camera.test.ts"
      - "src/video/riso57-palm-contact-silhouette.ts"
      - "tests/riso57-palmar-silhouette-artcraft.test.ts"
      - "src/video/riso58-anat1-volume-skin.ts"
      - "tests/riso58-anat1-volume-skin-artcraft.test.ts"
      - "tests/riso54-camera-ray-anatomy-artcraft.test.ts"
      - "tests/riso48-projected-support-artcraft.test.ts"
      - "tests/riso47-palmar-cup-artcraft.test.ts"
      - "tests/riso46-thenar-web-anatomy.test.ts"
      - "tests/e2e-storybook/riso46-thenar-web.spec.ts"
      - "src/video/riso31-finger-phalanges.ts"
      - "tests/riso38-hand-silhouettes.test.ts"
      - "src/video/riso39-opposed-paper-pinch.ts"
      - "src/video/riso-character-demo.tsx"
      - "tests/riso39-opposed-paper-pinch.test.ts"
      - "src/video/riso40-paper-fingertip-contact.ts"
      - "src/video/riso41-contact-pressure.ts"
      - "tests/riso41-real-red-pad-contact.test.ts"
      - "src/video/riso42-support-digits-gesture.ts"
      - "tests/riso42-support-finger-gesture.test.ts"
      - "src/video/riso43-physical-paper-depth.ts"
      - "src/video/riso44-source-index-paper-contact.ts"
      - "tests/riso45-support-digit-foreshortening.test.ts"
      - "tests/riso44-source-index-paper-contact.test.ts"
      - "tests/riso43-physical-paper-depth.test.ts"
      - "registry/video/riso-prop-handoff.ts"
      - "src/video/riso-human-ensemble.tsx"
      - "tests/riso40-paper-fingertip-contact.test.ts"
      - "tests/e2e-storybook/riso-human-ensemble.spec.ts"
      - "src/video/riso-hand-artcraft.ts"
      - "tests/riso37-anatomical-engraving.test.ts"
      - "tests/riso36-red-silhouette-gate.test.ts"
      - "src/video/riso30-human-hands-studio.tsx"
      - "tests/riso32-thumb-ip-artcraft.test.tsx"
      - "tests/e2e-storybook/riso32-thumb-ip-artcraft.spec.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: riso32-thumb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  anatomy-source-and-native-print:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Strict TypeScript and legacy animated source contracts
        run: |
          npm run typecheck
          npm run test -- tests/riso32-thumb-ip-artcraft.test.tsx tests/riso36-red-silhouette-gate.test.ts tests/riso37-anatomical-engraving.test.ts tests/riso38-hand-silhouettes.test.ts tests/riso39-opposed-paper-pinch.test.ts tests/riso40-paper-fingertip-contact.test.ts tests/riso41-real-red-pad-contact.test.ts tests/riso42-support-finger-gesture.test.ts tests/riso43-physical-paper-depth.test.ts tests/riso29-human-anatomy-neck-portrait.test.tsx tests/riso-character.test.tsx tests/riso17-anatomical-grip.test.tsx tests/riso21-ocular-print-artcraft.test.tsx tests/riso44-source-index-paper-contact.test.ts tests/riso45-support-digit-foreshortening.test.ts tests/riso46-thenar-web-anatomy.test.ts tests/riso47-palmar-cup-artcraft.test.ts tests/riso48-projected-support-artcraft.test.ts tests/riso31-phalange-artcraft.test.tsx tests/riso49-donor-projection-artcraft.test.ts tests/riso50-hand-macro-artcraft.test.ts tests/riso51-view-conditioned-source-artcraft.test.ts tests/riso52-folded-terminal-source-artcraft.test.ts tests/riso53-palmar-depth-composition-artcraft.test.tsx tests/riso54-camera-ray-anatomy-artcraft.test.ts tests/riso54-interdigital-paper-reserve.test.ts tests/riso55-foldback-pulp-artcraft.test.ts tests/riso56-handoff-camera.test.ts tests/riso57-palmar-silhouette-artcraft.test.ts tests/riso58-anat1-volume-skin-artcraft.test.ts
      - name: Build real Storybook
        run: npm run build-storybook
      - name: Chromium
        run: npx playwright install --with-deps chromium
      - name: Native print, two spot-ink masters, both humans and 16:9 / 9:16 whole-film handoff
        run: npx playwright test -c playwright.storybook.config.ts tests/e2e-storybook/riso32-thumb-ip-artcraft.spec.ts tests/e2e-storybook/riso-human-ensemble.spec.ts tests/e2e-storybook/riso46-thenar-web.spec.ts
      - name: Preserve actual screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riso32-native-thumb-proof
          path: test-results/
          retention-days: 7
          if-no-files-found: warn
