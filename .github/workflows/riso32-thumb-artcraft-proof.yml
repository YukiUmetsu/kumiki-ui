name: Risograph ArtCraft hand/stencil proof

# Scoped to RISO32 source and tests; no full cinematic export on unrelated PRs.
on:
  pull_request:
    paths:
      - ".github/workflows/riso32-thumb-artcraft-proof.yml"
      - "src/video/riso32-thumb-ip.ts"
      - "src/video/riso33-hand-negative-space.ts"
      - "src/video/riso36-red-silhouette-gate.ts"
      - "src/video/riso37-anatomical-engraving.ts"
      - "src/video/riso31-finger-phalanges.ts"
      - "tests/riso38-hand-silhouettes.test.ts"
      - "src/video/riso39-opposed-paper-pinch.ts"
      - "src/video/riso-character-demo.tsx"
      - "tests/riso39-opposed-paper-pinch.test.ts"
      - "src/video/riso40-paper-fingertip-contact.ts"
      - "src/video/riso41-contact-pressure.ts"
      - "tests/riso41-real-red-pad-contact.test.ts"
      - "src/video/riso42-support-digits-gesture.ts"
      - "tests/riso42-support-finger-gesture.test.ts"
      - "src/video/riso43-physical-paper-depth.ts"
      - "tests/riso43-physical-paper-depth.test.ts"
      - "registry/video/riso-prop-handoff.ts"
      - "src/video/riso-human-ensemble.tsx"
      - "tests/riso40-paper-fingertip-contact.test.ts"
      - "tests/e2e-storybook/riso-human-ensemble.spec.ts"
      - "src/video/riso-hand-artcraft.ts"
      - "tests/riso37-anatomical-engraving.test.ts"
      - "tests/riso36-red-silhouette-gate.test.ts"
      - "src/video/riso30-human-hands-studio.tsx"
      - "tests/riso32-thumb-ip-artcraft.test.tsx"
      - "tests/e2e-storybook/riso32-thumb-ip-artcraft.spec.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: riso32-thumb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  anatomy-source-and-native-print:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Strict TypeScript and legacy animated source contracts
        run: |
          npm run typecheck
          npm run test -- tests/riso32-thumb-ip-artcraft.test.tsx tests/riso36-red-silhouette-gate.test.ts tests/riso37-anatomical-engraving.test.ts tests/riso38-hand-silhouettes.test.ts tests/riso39-opposed-paper-pinch.test.ts tests/riso40-paper-fingertip-contact.test.ts tests/riso41-real-red-pad-contact.test.ts tests/riso42-support-finger-gesture.test.ts tests/riso43-physical-paper-depth.test.ts tests/riso29-human-anatomy-neck-portrait.test.tsx tests/riso-character.test.tsx tests/riso17-anatomical-grip.test.tsx tests/riso21-ocular-print-artcraft.test.tsx
      - name: Build real Storybook
        run: npm run build-storybook
      - name: Chromium
        run: npx playwright install --with-deps chromium
      - name: Native print, two spot-ink masters, both humans and 16:9 / 9:16 whole-film handoff
        run: npx playwright test -c playwright.storybook.config.ts tests/e2e-storybook/riso32-thumb-ip-artcraft.spec.ts tests/e2e-storybook/riso-human-ensemble.spec.ts
      - name: Preserve actual screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riso32-native-thumb-proof
          path: test-results/
          retention-days: 7
          if-no-files-found: warn
