name: Colored Pencil Film Proof

# Focused browser and production evidence only on pencil-style PR changes.
# Full browser and encoded-film qualification is local-first and opt-in.
# No expensive renderer/Playwright/FFmpeg job runs for routine PRs or main pushes.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: colored-pencil-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  art-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Focused deterministic pencil material tests
        run: npx vitest run --project unit tests/colored-pencil-science.test.tsx tests/colored-pencil-scene.test.tsx tests/colored-pencil-actor.test.tsx
      - name: Verify portable film schema
        run: |
          npm run film:check -- examples/film/colored-pencil-science.film.json
          npm run film:check -- examples/film/colored-pencil-character.film.json
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Frame-level browser layout, pencil geometry and out-of-order seek
        run: npx playwright test -c playwright.storybook.config.ts tests/e2e-storybook/colored-pencil-science.spec.ts tests/e2e-storybook/colored-pencil-actor.spec.ts
      - name: Install FFmpeg for actual film capture
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Encode film and export final illustration in both aspects
        run: |
          npm run film:frame -- examples/film/colored-pencil-science.film.json --frame=275 --only=landscape --out=dist/colored-pencil-proof
          npm run film:frame -- examples/film/colored-pencil-science.film.json --frame=352 --only=portrait --out=dist/colored-pencil-proof
          npm run film:frame -- examples/film/colored-pencil-character.film.json --frame=240 --only=landscape --out=dist/colored-pencil-proof
          npm run film:frame -- examples/film/colored-pencil-character.film.json --frame=240 --only=portrait --out=dist/colored-pencil-proof
          npm run film:render -- examples/film/colored-pencil-science.film.json --frames=353 --only=landscape --out=dist/colored-pencil-proof
          npm run film:render -- examples/film/colored-pencil-science.film.json --frames=353 --only=portrait --out=dist/colored-pencil-proof
      - name: Preserve browser screenshots and pixel diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: colored-pencil-browser-evidence
          path: test-results/
          retention-days: 10
          if-no-files-found: warn
      - name: Preserve actual production film and frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: colored-pencil-production-evidence
          path: dist/colored-pencil-proof/
          retention-days: 10
          if-no-files-found: warn
