name: One-time RISO8 Focused Fine Mesh and Storybook QA
# Temporarily qualify the story suite and clean registry fixture; remove before merge.
on:
  pull_request:
    branches: [main]
    paths:
      - "registry/video/riso-proportion-mesh.ts"
      - "registry/video/riso-character-sheet-react.tsx"
      - "src/video/riso-character-model-sheets.stories.tsx"
      - "tests/riso-fine-mesh.test.ts"
      - "tests/e2e-storybook/riso-character-model-sheets.spec.ts"
      - ".github/workflows/riso8-focused-proof.yml"
permissions:
  contents: read
concurrency:
  group: riso8-focus-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Riso focused and opaque print regression contracts
        run: npm run test -- tests/riso-character.test.tsx tests/riso-rig-ik.test.tsx tests/riso-nested-ik.test.ts tests/riso-joint-skin.test.ts tests/riso-opaque-characters.test.tsx tests/riso-character-model-sheets.test.tsx tests/riso-source-contour.test.ts tests/riso-fine-mesh.test.ts
      - name: Validate Riso registry metadata
        run: npm run registry:validate
      - name: Independent clean Riso consumer
        run: node scripts/registry-fixture.js --item=riso-character
      - name: Chromium setup
        run: npx playwright install --with-deps chromium
      - name: Browser check 5 Riso Storybook stories, mesh density and SVG export
        run: npx playwright test -c playwright.storybook.config.ts tests/e2e-storybook/riso-storybook-smoke.spec.ts tests/e2e-storybook/riso-character-model-sheets.spec.ts
      - name: Preserve screenshots, SVG and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riso8-focused-fine-mesh-chromium-proof
          path: test-results/
          retention-days: 7
          if-no-files-found: warn
