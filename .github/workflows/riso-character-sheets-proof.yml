name: One-time Risograph character-sheet visual proof
# Purpose-built one-off qualification. Remove after screenshot review.
# No FFmpeg, full film render, general Storybook sweep, or main push trigger.
on:
  pull_request:
    branches: [main]
    paths:
      - "src/video/riso-character-model-sheets.stories.tsx"
      - "src/video/riso-character-mesh-sheets.ts"
      - "registry/video/riso-character-sheet-react.tsx"
      - "registry/video/riso-proportion-mesh.ts"
      - "tests/e2e-storybook/riso-character-model-sheets.spec.ts"
      - ".github/workflows/riso-character-sheets-proof.yml"
permissions:
  contents: read
concurrency:
  group: riso-sheet-proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  screenshot-two-sheets:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Capture Courier and Paper Bird construction sheets
        run: npx playwright test -c playwright.storybook.config.ts tests/e2e-storybook/riso-character-model-sheets.spec.ts
      - name: Preserve original browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riso-character-sheets-browser-proof
          path: test-results/
          retention-days: 7
          if-no-files-found: warn
