name: Chinese Ink Shanshui Film Quality

on:
  pull_request:
    paths:
      - "registry/video/ink-shanshui*"
      - "src/video/ink-shanshui*"
      - "tests/ink-shanshui.test.tsx"
      - "tests/e2e-storybook/ink-shanshui.spec.ts"
      - "docs/research/shanshui-reference-to-code-2026.md"
      - "registry.json"
      - ".github/workflows/ink-shanshui-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ink-shanshui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shanshui:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: Deterministic painting, actor and composition tests
        run: npx vitest run --project unit tests/ink-shanshui.test.tsx
      - name: Registry and catalog installation contracts
        run: |
          npm run registry:validate
          npm run catalog:check
      - name: Chromium
        run: npx playwright install --with-deps chromium
      - name: All three films in the actual Storybook browser
        run: npx playwright test -c playwright.storybook.config.ts tests/e2e-storybook/ink-shanshui.spec.ts
      - name: FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Encode three art-directed, full-resolution production proofs
        run: |
          npm run video:export -- --story=video-ink-shanshui--mountain-trail-export --startFrame=115 --frames=96 --output=dist/shanshui-mountain-trail.mp4
          npm run video:export -- --story=video-ink-shanshui--river-scholar-export --startFrame=115 --frames=96 --output=dist/shanshui-river-scholar.mp4
          npm run video:export -- --story=video-ink-shanshui--misty-hermit-export --startFrame=115 --frames=96 --output=dist/shanshui-misty-hermit.mp4
      - name: Preserve moving-film evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shanshui-original-mp4-evidence
          path: dist/shanshui-*.mp4
          retention-days: 10
          if-no-files-found: warn
      - name: Preserve visual comparison and regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shanshui-original-browser-evidence
          path: test-results/
          retention-days: 10
          if-no-files-found: warn
