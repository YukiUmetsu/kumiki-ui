name: Chinese Ink Shanshui Film Quality

on:
  pull_request:
    paths:
      - "registry/video/ink-shanshui*"
      - "registry/character/figure-proportion-study.ts"
      - "src/video/ink-shanshui*"
      - "src/video/ink-anatomical-portrait*"
      - "tests/ink-shanshui.test.tsx"
      - "tests/ink-shanshui-proportion.test.tsx"
      - "tests/ink-shanshui-full-body.test.tsx"
      - "tests/ink-shanshui-fine-craft.test.tsx"
      - "tests/ink-shanshui-pine-fringe.test.tsx"
      - "tests/ink-shanshui-reader-face.test.tsx"
      - "tests/ink-shanshui-reader-expression.test.tsx"
      - "tests/ink-shanshui-reader-crown.test.tsx"
      - "tests/ink-anatomical-portrait-rebuild.test.tsx"
      - "tests/e2e-storybook/ink-shanshui.spec.ts"
      - "tests/e2e-storybook/ink-shanshui-proportion.spec.ts"
      - "tests/e2e-storybook/ink-shanshui-reader-face.spec.ts"
      - "tests/e2e-storybook/ink-shanshui-reader-expression.spec.ts"
      - "tests/e2e-storybook/ink-storybook-navigation.spec.ts"
      - "tests/e2e-storybook/ink-anatomical-portrait-rebuild.spec.ts"
      - "docs/research/chinese-ink-anatomical-portrait-rebuild-2026-11-17.md"
      - "docs/research/shanshui-reference-to-code-2026.md"
      - "registry.json"
      - ".github/workflows/ink-shanshui-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ink-shanshui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shanshui:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: Deterministic painting, actor and composition tests
        run: npx vitest run --project unit tests/ink-shanshui.test.tsx tests/ink-shanshui-proportion.test.tsx tests/ink-shanshui-full-body.test.tsx tests/ink-shanshui-fine-craft.test.tsx tests/ink-shanshui-pine-fringe.test.tsx tests/ink-shanshui-reader-face.test.tsx tests/ink-shanshui-reader-expression.test.tsx tests/ink-shanshui-reader-crown.test.tsx tests/ink-anatomical-portrait-rebuild.test.tsx
      - name: Registry and catalog installation contracts
        run: |
          npm run registry:validate
          npm run catalog:find -- --id=pack:ink-shanshui-landscape --format=json
      - name: Chromium
        run: npx playwright install --with-deps chromium
      - name: Original Shanshui films and consolidated Chinese Ink Storybook navigation
        run: npx playwright test -c playwright.storybook.config.ts tests/e2e-storybook/ink-shanshui.spec.ts tests/e2e-storybook/ink-shanshui-proportion.spec.ts tests/e2e-storybook/ink-shanshui-reader-face.spec.ts tests/e2e-storybook/ink-shanshui-reader-expression.spec.ts tests/e2e-storybook/ink-storybook-navigation.spec.ts tests/e2e-storybook/ink-anatomical-portrait-rebuild.spec.ts
      - name: FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Encode source-informed reader-face motion proof
        run: |
          # Include multiple planted-foot stride cycles before the still
          # contemplation hold. The former late 115–210 window obscured gait QA.
          npm run video:export -- --story=video-ink-shanshui--river-scholar-export --startFrame=44 --frames=96 --output=dist/shanshui-river-scholar.mp4
      - name: Preserve moving-film evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shanshui-original-mp4-evidence
          path: dist/shanshui-*.mp4
          retention-days: 10
          if-no-files-found: warn
      - name: Preserve visual comparison and regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shanshui-original-browser-evidence
          path: test-results/
          retention-days: 10
          if-no-files-found: warn
