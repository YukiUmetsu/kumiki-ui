name: One-time RISO10 single-folder Storybook verification
# Temporary PR proof; restore manual-only after evidence review.
on:
  pull_request:
    branches: [main]
    paths:
      - "src/video/riso-print-studios.stories.tsx"
      - "src/video/film-looks.stories.tsx"
      - "src/video/riso-artcraft-studies.stories.tsx"
      - "tests/riso-storybook-navigation.test.ts"
      - "tests/e2e-storybook/riso-film-looks.spec.ts"
      - "tests/e2e-storybook/riso-storybook-smoke.spec.ts"
      - ".github/workflows/riso9-artcraft-proof.yml"
permissions:
  contents: read
concurrency:
  group: riso10-single-folder
  cancel-in-progress: true
jobs:
  risograph-storybook-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Source type safety and Risograph navigation contracts
        run: |
          npm run typecheck
          npx vitest run --project unit tests/riso-storybook-navigation.test.ts tests/riso-artcraft-characters.test.tsx tests/riso-character-model-sheets.test.tsx
      - name: Production Storybook build
        run: npm run build-storybook
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify every Risograph story, printing studio and ArtCraft detail
        run: npx playwright test -c playwright.storybook.config.ts --timeout=90000 tests/e2e-storybook/riso-film-looks.spec.ts tests/e2e-storybook/riso-storybook-smoke.spec.ts tests/e2e-storybook/riso-artcraft-studies.spec.ts
      - name: Preserve actual rendered Risograph evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riso10-single-folder-storybook-evidence
          path: test-results/
          retention-days: 7
          if-no-files-found: warn
