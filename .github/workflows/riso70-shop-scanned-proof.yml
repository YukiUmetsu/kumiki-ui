name: RISO70 explicit print-shop paper margins and measured scanner registration proof
on:
  pull_request:
    paths:
      - ".github/workflows/riso70-shop-scanned-proof.yml"
      - "registry/video/riso-shop-profile.ts"
      - "registry/video/riso-scan-proof.ts"
      - "registry.json"
      - "src/video/riso-shop-proof-studio.tsx"
      - "src/video/riso-print-studios.stories.tsx"
      - "tests/riso70-shop-scan-proof.test.tsx"
      - "tests/e2e-storybook/riso70-shop-scan-proof.spec.ts"
      - "docs/research/riso70-shop-scan-artcraft.md"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: riso70-shop-\${{ github.ref }}
  cancel-in-progress: true
jobs:
  actual-shop-source-and-registration:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Strict TypeScript and original RISO70-RISO65 source QA
        run: |
          npm run typecheck
          npm run test -- tests/riso70-shop-scan-proof.test.tsx tests/riso69-press-master-formats.test.tsx tests/riso68-master-separations.test.tsx tests/riso67-topology-guard.test.tsx tests/riso66-contact-trap.test.tsx tests/riso65-registration-preflight.test.tsx
      - name: Independent riso-print clean consumer installation and registry validation
        run: |
          npm run registry:validate
          node scripts/registry-fixture.js --item=riso-print
      - name: Repository-wide catalog parity (existing unrelated metadata gaps)
        continue-on-error: true
        run: npm run catalog:check
      - name: Actual FilmStage and Risograph Storybook production build
        run: npm run build-storybook
      - run: npx playwright install --with-deps chromium
      - name: Real native paper art, scanner measurements, unsafe margins, and PDF files
        run: npx playwright test -c playwright.storybook.config.ts tests/e2e-storybook/riso70-shop-scan-proof.spec.ts
      - name: Independent PDF file decoding and physical page render
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          command -v pdfinfo
          find test-results -name 'riso70-*-source.pdf' -print -exec pdfinfo '{}' ';'
          find test-results -name 'riso70-*-source.pdf' -exec sh -c 'pdftoppm -f 1 -singlefile -scale-to 1200 -png "$1" "$1.render"' _ '{}' ';'
      - name: Archive 1x/2x original source and independent PDF render
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riso70-original-masters-and-scanner-preflight-proof
          path: test-results/
          retention-days: 5
          if-no-files-found: warn
