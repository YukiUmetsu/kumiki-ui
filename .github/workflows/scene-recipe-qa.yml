name: Scene recipe browser qualification
# Legacy Storybook browser and video qualification is not automatic PR CI.
# Run it manually when scene-recipe visual evidence is needed.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scene-recipe-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-scenes:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install FFmpeg with the drawtext filter
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -hide_banner -version | head -1
          ffmpeg -hide_banner -filters | grep -q ' drawtext '
          ffprobe -hide_banner -version | head -1
      - name: Build all Storybook recipe demos
        run: npm run build-storybook
      - name: Review real DOM geometry, image loading and capture seek for 24 recipes
        run: npx playwright test -c playwright.storybook.config.ts tests/e2e-storybook/scene-templates.spec.ts
      - name: Check original two-lane swap frame visibility, protected text and screenshots
        run: npx playwright test -c playwright.storybook.config.ts tests/e2e-storybook/two-lane-swap.spec.ts
      - name: Review paired focus frames in landscape/portrait Storybook
        run: npx playwright test -c playwright.storybook.config.ts tests/e2e-storybook/paired-focus.spec.ts
      - name: Export and verify 26 short MP4 scene samples
        env:
          KM_SCENE_OUTPUT_DIR: test-results/scene-video-samples
          KM_SCENE_SMOKE_FULL: "1"
        run: node scripts/scene-template-video-smoke.mjs
      - name: Keep frame screenshots and Playwright traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scene-recipe-browser-evidence
          path: |
            test-results/**
            playwright-report/**
          if-no-files-found: ignore
          retention-days: 14
